name: Validate build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 work/build.py
      - run: python3 work/validate_release.py
      - run: node --check dist/sniffies.user.js && node --check chrome/filter.js
      - run: node --test work/tests/*.test.cjs
      - run: python3 -m unittest discover -s work/tests -p 'test_*.py'
      - name: Require committed build outputs to match source
        run: git diff --exit-code
