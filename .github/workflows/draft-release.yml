name: Prepare draft release (never publishes)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag matching VERSION, e.g. v1.5.1
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: lens-draft-release
  cancel-in-progress: false
jobs:
  draft:
    if: github.repository == 'slpcc63/lens' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an existing stable tag from main
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" origin/main
          git checkout --detach "refs/tags/$RELEASE_TAG"
          test -f dist/sniffies.user.js
      - run: python3 work/build.py
      - run: python3 work/validate_release.py --tag "$RELEASE_TAG"
      - run: node --check dist/sniffies.user.js && node --check chrome/filter.js
      - run: node --test work/tests/*.test.cjs
      - run: python3 -m unittest discover -s work/tests -p 'test_*.py'
      - run: git diff --exit-code
      - name: Create a new draft only; never replace an existing release
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > /tmp/lens-release-tags
          if grep -Fxq "$RELEASE_TAG" /tmp/lens-release-tags; then
            echo 'A release already exists for this tag; refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/sniffies.user.js \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Lens $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
